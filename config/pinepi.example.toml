[storage]
# Persistent storage only; do not place scans or captures on /tmp tmpfs.
scan_path = "/var/lib/pinepi/scans"
capture_path = "/var/lib/pinepi/captures"
database_path = "/var/lib/pinepi/data/pinepi.db"
# Common values: 500, 1024, or 5120.
max_capture_mb = 1024

[recon]
max_sessions = 50
max_age_days = 90
max_signal_samples_per_ap = 50
oui_paths = ["/usr/share/ieee-data/oui.txt", "/usr/share/misc/oui.txt"]
# Development only. Production never silently falls back to fixtures.
mock_mode = false
mock_scenario = "normal" # normal, empty, failure, or missing_adapter
# auto deterministically selects PinePi/airodump until a Kismet API source is configured.
engine = "auto" # auto, airodump, or kismet

[active_tests]
# Hard safety ceilings; individual requests may choose smaller values.
max_runtime_seconds = 30
max_deauth_bursts = 32

[analysis]
# Opening the UI never bypasses these offline-analysis limits.
max_input_mb = 2048
max_packets = 50000
max_result_rows = 1000

[management_ap]
enabled = true
ssid = "PinePi"
password = "CHANGE-ME-BEFORE-USE"
interface_role = "management"
address = "10.43.0.1/24"
dhcp_start = "10.43.0.20"
dhcp_end = "10.43.0.100"
channel = 1
country_code = "AT"

[training_ap]
subnet = "10.42.0.0/24"
address = "10.42.0.1/24"
gateway = "10.42.0.1"
dhcp_start = "10.42.0.20"
dhcp_end = "10.42.0.200"
country = "AT"
# Development convenience only. The UI does not expose this value.
default_password = "CHANGE-ME-BEFORE-USE"

[adapters]
management_interfaces = ["wlan0"]
management_drivers = ["brcmfmac"]
audit_usb_ids = ["0bda:8813"]
ap_usb_ids = ["148f:5572"]

[runtime]
helper = "/usr/local/sbin/pinepi-helper"
sudo = true
command_timeout = 12.0
status_cache_seconds = 2.0
